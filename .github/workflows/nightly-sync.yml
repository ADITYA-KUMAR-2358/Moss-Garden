# GitHub Actions starts the nightly garden sync for Render or Vercel.
# The request-bound job completes before the endpoint responds.
# MOSS_GARDEN_URL may be configured as a repository secret or variable; the
# legacy RENDER_HEALTH_URL name remains supported. SYNC_SECRET must be a secret.
name: Nightly garden sync

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Start the sync
        env:
          HEALTH_URL: ${{ secrets.MOSS_GARDEN_URL || vars.MOSS_GARDEN_URL || secrets.RENDER_HEALTH_URL || vars.RENDER_HEALTH_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::MOSS_GARDEN_URL is not set, so nightly sync is skipped. Add it as a repository secret or variable."
            exit 0
          fi
          if [ -z "$SYNC_SECRET" ]; then
            echo "::warning title=Nightly sync skipped::Add the repository secret SYNC_SECRET (same value as the backend service) to run the nightly sync."
            exit 0
          fi
          BASE="${HEALTH_URL%/}"
          BASE="${BASE%/healthz}"
          curl --fail --show-error --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $SYNC_SECRET" "$BASE/api/jobs/nightly"
          echo