# Render cron jobs have no free plan, so GitHub Actions starts the nightly garden sync.
# The web service runs the sync in the background and answers 202 straight away.
# Needs the repository variable RENDER_HEALTH_URL (shared with keep-alive.yml)
# and the repository secret SYNC_SECRET, copied from the Render dashboard.
name: Nightly garden sync

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Start the sync
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$HEALTH_URL" ] || [ -z "$SYNC_SECRET" ]; then
            echo "Set the variable RENDER_HEALTH_URL and the secret SYNC_SECRET in this repository."
            exit 1
          fi
          BASE="${HEALTH_URL%/healthz}"
          curl --fail --show-error --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $SYNC_SECRET" "$BASE/api/jobs/nightly"
          echo
