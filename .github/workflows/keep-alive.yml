# Render free web services spin down after 15 minutes without an inbound request.
# Render's own health probe does not count. This ping does.
# GitHub may start a scheduled run late. A late ping can still find the service asleep;
# the retries wait through the cold start, which Render documents as about one minute.
name: Keep the garden awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        env:
          URL: ${{ secrets.RENDER_HEALTH_URL || vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::RENDER_HEALTH_URL is not set, so there is nothing to ping. Add it as a repository secret or variable."
            exit 0
          fi
          URL="${URL%/}"
          case "$URL" in
            */healthz) ;;
            *) URL="$URL/healthz" ;;
          esac
          curl --fail --show-error --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$URL"
          echo
          echo "Health check answered."